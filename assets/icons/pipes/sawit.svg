<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
  <defs>
    <linearGradient id="sawitTrunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38220f"/>
      <stop offset="25%" stop-color="#5c3d1e"/>
      <stop offset="60%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#38220f"/>
    </linearGradient>
    <linearGradient id="sawitCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <!-- Trunk -->
  <rect x="10" y="11" width="12" height="17" rx="2" fill="url(#sawitTrunk)" stroke="#271607" stroke-width="1"/>
  <!-- Pelepah scales -->
  <path d="M11 15 L16 18 L21 15 M11 19 L16 22 L21 19 M11 23 L16 26 L21 23" fill="none" stroke="#a16207" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tandan Sawit (Oil palm fruit cluster) -->
  <circle cx="12.5" cy="12.5" r="1.6" fill="#dc2626"/>
  <circle cx="15" cy="13.5" r="1.8" fill="#ea580c"/>
  <circle cx="17.5" cy="12.8" r="1.7" fill="#f97316"/>
  <circle cx="19.2" cy="13.8" r="1.4" fill="#ea580c"/>
  <circle cx="16" cy="12.2" r="1.3" fill="#facc15"/>
  <!-- Cap / Frond Collar -->
  <rect x="7.5" y="5.5" width="17" height="6.5" rx="2" fill="url(#sawitCap)" stroke="#14532d" stroke-width="1"/>
  <!-- Palm Fronds -->
  <path d="M8 7 C4 4, 2 8, 1 12" fill="none" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M24 7 C28 4, 30 8, 31 12" fill="none" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 6 C10 2, 6 2, 4 4" fill="none" stroke="#4ade80" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M20 6 C22 2, 26 2, 28 4" fill="none" stroke="#4ade80" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Highlight streak -->
  <line x1="12" y1="6" x2="12" y2="28" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
</svg>
