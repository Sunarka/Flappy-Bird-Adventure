<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Bird Silhouette -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <ellipse cx="20" cy="20" rx="16" ry="13" fill="#ffd000"/>
    <path d="M32 16 L44 20 L32 24 Z" fill="#f97316"/>
    <circle cx="26" cy="15" r="4.8" fill="#fff"/>
    <circle cx="27.5" cy="15" r="2.2" fill="#0f172a"/>
    <ellipse cx="15" cy="22" rx="9" ry="6" fill="#f59e0b" transform="rotate(-15 15 22)"/>
  </g>
  <!-- Text Logo -->
  <text x="68" y="27" font-family="'Trebuchet MS', Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" filter="url(#shadow)">FLAPPY</text>
  <text x="68" y="49" font-family="'Trebuchet MS', Arial, sans-serif" font-size="22" font-weight="900" fill="url(#goldGrad)" filter="url(#shadow)">BIRD</text>
</svg>